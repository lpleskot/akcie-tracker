# akcie-tracker — jednotný Worker: statické assety (web) + /api/* + oba crony.
# Deploy: Workers Builds (CF git integrace) — npx wrangler deploy při každém
# pushi do main. Lokální vývoj: npx wrangler dev (viz README).

# Jméno musí sedět s Workers Builds projektem v CF — jinak ho CI při buildu
# přepíše a otevírá PR na "opravu" configu.
name = "akcie-tracker"
main = "worker/index.js"
compatibility_date = "2026-05-01"
workers_dev = true
# Preview URLs vypnuté — privátní nástroj, verze nemají co viset na dalších URL.
preview_urls = false

# Celý repo root je zároveň asset složka — co NEservírovat určuje .assetsignore
# (worker/, scripts/, .github/, *.md, …). _headers čte platforma automaticky.
[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"

# Jediný denní cron: Flex import + hned po něm vyhodnocení alertů.
# Crony jedou jen v UTC → 5:00 UTC = 7:00 Prahy v létě / 6:00 v zimě
# (vědomé zjednodušení, DST drift je ok — rozhodnutí 2026-07-25).
[triggers]
crons = ["0 5 * * *"]

# Sdílená KV namespace (watchlist, alerts, notes, journal, portfolio-overlay:*, fired:*)
[[kv_namespaces]]
binding = "AKCIE_TRACKER_KV"
id = "6d78ccbecdc64d7e9798f1ed39fca35d"

[vars]
PORTFOLIO_ID = "plegi-invest-ibkr"
FLEX_QUERY_ID = "1514926"
# DRY_RUN = "true" → flex-import parsuje a loguje, ale nezapíše do KV.
DRY_RUN = "false"

# Secrets — nastavit v CF dashboardu (Worker → Settings → Variables and Secrets)
# nebo přes `wrangler secret put <NÁZEV>`:
#   FLEX_TOKEN — token z IBKR Flex Web Service Configuration (povinné)
#   ADMIN_KEY  — ochrana manuálních /run/* endpointů (bez něj zavřeno)
# Žádné notifikace — e-maily (Resend) odstraněny 2026-07-23; selhání jobů je
# vidět v CF lozích, fired alerty v tabu Alerty. Access service token není
# potřeba — joby čtou portfolio JSON přes ASSETS binding a ceny přímo.
