# akcie-tracker — jednotný Worker: statické assety (web) + /api/* + oba crony.
# Deploy: Workers Builds (CF git integrace) — npx wrangler deploy při každém
# pushi do main. Lokální vývoj: npx wrangler dev (viz README).

# Jméno musí sedět s Workers Builds projektem v CF — jinak ho CI při buildu
# přepíše a otevírá PR na "opravu" configu.
name = "akcie-tracker"
account_id = "20091577c7377c278960a1808ca175ba"
main = "worker/index.js"
compatibility_date = "2026-05-01"
workers_dev = true
# Preview URLs vypnuté — privátní nástroj, verze nemají co viset na dalších URL.
preview_urls = false

# Celý repo root je zároveň asset složka — co NEservírovat určuje .assetsignore
# (worker/, scripts/, .github/, *.md, …). _headers čte platforma automaticky.
[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"

# Crony jedou jen v UTC.
# - "0 5 * * *": Flex import → ranní report do PLEGINu → vyhodnocení alertů.
#   5:00 UTC = 7:00 Prahy v létě / 6:00 v zimě (vědomé zjednodušení, DST
#   drift je ok — rozhodnutí 2026-07-25).
# - "20 5,6 * * TUE-SAT": pojistka reportu v 7:20 Prahy. Oba UTC časy
#   (5:20 UTC = 7:20 v létě, 6:20 UTC = 7:20 v zimě), kód pustí jen ten,
#   kdy je v Praze 7:xx. Řetězec musí sedět s CRON_REPORT_BACKUP v index.js.
[triggers]
crons = ["0 5 * * *", "20 5,6 * * TUE-SAT"]

# PLEGIN = Worker todo na stejném CF účtu. Ranní report Akcie do něj jde přes
# service binding — fetch na jiný *.workers.dev Worker téhož účtu Cloudflare
# odmítne (chyba 1042) a /api/* PLEGINu je navíc za Access.
[[services]]
binding = "PLEGIN"
service = "todo"

# Sdílená KV namespace (watchlist, alerts, notes, journal, portfolio-overlay:*, fired:*)
[[kv_namespaces]]
binding = "AKCIE_TRACKER_KV"
id = "6d78ccbecdc64d7e9798f1ed39fca35d"

[vars]
PORTFOLIO_ID = "plegi-invest-ibkr"
FLEX_QUERY_ID = "1514926"
# Lynx (osobní portfolio lukas-pleskot-lynx) — query ID z LYNX portálu, token
# je secret LYNX_FLEX_TOKEN. Dokud chybí jedno z nich, ranní import Lynx přeskočí.
LYNX_FLEX_QUERY_ID = ""
# DRY_RUN = "true" → flex-import parsuje a loguje, ale nezapíše do KV.
DRY_RUN = "false"
# PLEGIN_REPORT = "off" vypne ranní report do PLEGINu (po importu, pojistka
# i ruční běh; ?dry=1 funguje dál). Import a alerty běží nezávisle.
PLEGIN_REPORT = "on"

# Secrets — nastavit v CF dashboardu (Worker → Settings → Variables and Secrets)
# nebo přes `wrangler secret put <NÁZEV>`:
#   FLEX_TOKEN          — token z IBKR Flex Web Service Configuration (povinné)
#   LYNX_FLEX_TOKEN     — token z LYNX Flex Web Service Configuration (osobní
#                         portfolio; bez něj se Lynx v importu přeskočí)
#   ADMIN_KEY           — ochrana manuálních /run/* endpointů (bez něj zavřeno)
#   MCP_TOKEN           — přístup k /mcp (bez něj zavřeno)
#   PLEGIN_REPORT_TOKEN — report token PLEGINu, smí jen report „akcie"
#                         (zadání 13 v ~/Projects/todo; bez něj se report neposílá)
#   REPORT_RUN_TOKEN    — ruční běh POST /api/plegin-report/run pro hlídač PLEGINu
#                         (stejná hodnota je v Workeru todo jako AKCIE_RUN_TOKEN)
# Žádné notifikace — e-maily (Resend) odstraněny 2026-07-23; selhání jobů je
# vidět v CF lozích, fired alerty v tabu Alerty. Access service token není
# potřeba — joby čtou portfolio JSON přes ASSETS binding a ceny přímo.
